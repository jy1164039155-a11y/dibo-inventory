name: Build and publish Android APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scan format regression
        run: node --test tests/scanner-format.test.cjs
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEY_PASSWORD"
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/dibo-release.jks
          printf 'storeFile=signing/dibo-release.jks\nstorePassword=%s\nkeyAlias=dibo-release\nkeyPassword=%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD" > keystore.properties
      - name: Build and lint
        run: |
          python3 release.py prepare "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          . ./release.env
          gradle --no-daemon assembleRelease lintRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"
          python3 release.py package "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
      - name: Publish APK and version manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/dibo-inventory.apk dist/version.json dist/SHA256SUMS.txt --verify-tag --title "地博清查 $GITHUB_REF_NAME" --generate-notes
